services:
  - type: web
    name: orbis-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BINANCE__API_KEY
        sync: false
      - key: BINANCE__API_SECRET
        sync: false
      - key: BINANCE__TESTNET
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
